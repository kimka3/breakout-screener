name: Daily breakout screen

on:
  schedule:
    # 22:37 UTC = 다음날 07:37 KST. 미국장 마감(05:00 KST) 후,
    # 한국장 개장(09:00 KST) 전이라 양쪽 모두 전일 봉이 확정된 시각.
    #
    # 정각(:00)은 전 세계 사용자가 몰려 대기열이 길어지므로 일부러 어긋낸다.
    # 예약 실행은 "이 시각에 실행"이 아니라 "이 시각에 대기열에 넣는다"는
    # 뜻이라, 정각에 걸면 30분~1시간씩 밀리는 일이 잦다.
    - cron: "37 22 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 생성된 리포트를 gh-pages 로 밀어넣기 위해 필요

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 스크리너 실행
        run: |
          python sp500_breakout.py --lookback 20 \
            --html report.html --out breakouts_20d.csv --summary summary.txt

      - name: 결과 확인
        run: |
          test -s report.html || { echo "report.html 이 비어 있음"; exit 1; }
          test -s summary.txt || { echo "summary.txt 이 비어 있음"; exit 1; }
          echo "생성 크기: $(wc -c < report.html) bytes"
          cat summary.txt

      - name: 페이지용 폴더 구성
        run: |
          mkdir -p public
          cp report.html public/index.html
          cp breakouts_20d.csv public/breakouts.csv
          # 홈 화면 아이콘 — 저장소에 커밋된 것을 그대로 배포한다
          cp apple-touch-icon.png favicon.png icon-512.png public/
          ls -l public/

      - uses: actions/upload-artifact@v7
        with:
          name: screen-output
          path: |
            report.html
            breakouts_20d.csv
            summary.txt
          retention-days: 14

      - name: GitHub Pages 로 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      # 성공이든 실패든 알린다. 조용히 실패하면 오래된 리포트를 최신으로 착각하게 된다.
      - name: 텔레그램 알림
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 붙여넣기 과정에서 끼어든 줄바꿈·공백을 털어낸다.
          # 토큰에 개행이 하나만 섞여도 URL 이 깨져 curl 이 exit 3 으로 죽는다.
          TG_TOKEN="$(printf '%s' "$TG_TOKEN" | tr -d '[:space:]')"
          TG_CHAT="$(printf '%s' "$TG_CHAT" | tr -d '[:space:]')"

          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "시크릿이 없어 알림을 건너뜁니다."
            echo "  TELEGRAM_BOT_TOKEN : ${#TG_TOKEN} 자"
            echo "  TELEGRAM_CHAT_ID   : ${#TG_CHAT} 자"
            echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions 에서 등록하세요."
            exit 0
          fi

          # 토큰 형식: <숫자>:<문자열>. 값 자체는 찍지 않고 길이만 남긴다.
          case "$TG_TOKEN" in
            *:*) : ;;
            *)
              echo "TELEGRAM_BOT_TOKEN 형식이 잘못됐습니다."
              echo "  '숫자:문자열' 형태여야 합니다 (예: 8123456789:AAH...)"
              echo "  현재 길이 ${#TG_TOKEN} 자, 콜론 없음"
              echo "  BotFather 가 준 값을 'bot' 접두사나 따옴표 없이 그대로 넣으세요."
              exit 1
              ;;
          esac

          if [ "$JOB_STATUS" = "success" ] && [ -s summary.txt ]; then
            TEXT="$(cat summary.txt)"
          else
            TEXT="[120일선 돌파 스크린] 실행 실패 ($JOB_STATUS)
          리포트가 갱신되지 않았습니다. 이전 결과는 그대로입니다.
          $RUN_URL"
          fi

          # curl 실패를 자체 메시지로 바꿔 준다. 기본값 그대로면 exit 3 같은
          # 숫자만 남아 원인을 알 수 없다.
          set +e
          code=$(curl -sS -o /tmp/tg.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true")
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "curl 자체가 실패했습니다 (exit $rc)."
            [ "$rc" = "3" ] && echo "  exit 3 = URL 형식 오류. 토큰에 이상한 문자가 섞여 있습니다."
            [ "$rc" = "6" ] && echo "  exit 6 = 주소를 찾지 못함. 네트워크 문제입니다."
            exit 1
          fi

          if [ "$code" != "200" ]; then
            echo "텔레그램이 요청을 거부했습니다 (HTTP $code)"
            cat /tmp/tg.json 2>/dev/null || true
            echo ""
            echo "  401 → 토큰이 틀렸습니다"
            echo "  400 + 'chat not found' → 챗ID 가 틀렸거나, 봇에게 먼저 말을 걸지 않았습니다"
            exit 1
          fi
          echo "텔레그램 전송 완료"
