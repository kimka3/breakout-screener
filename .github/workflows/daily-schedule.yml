name: Daily breakout screen

on:
  schedule:
    # 22:37 UTC = 다음날 07:37 KST. 미국장 마감(05:00 KST) 후,
    # 한국장 개장(09:00 KST) 전이라 양쪽 모두 전일 봉이 확정된 시각.
    #
    # 정각(:00)은 전 세계 사용자가 몰려 대기열이 길어지므로 일부러 어긋낸다.
    # 예약 실행은 "이 시각에 실행"이 아니라 "이 시각에 대기열에 넣는다"는
    # 뜻이라, 정각에 걸면 30분~1시간씩 밀리는 일이 잦다.
    - cron: "37 22 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 생성된 리포트를 gh-pages 로 밀어넣기 위해 필요

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 스크리너 실행
        run: |
          python sp500_breakout.py --lookback 20 \
            --html report.html --out breakouts_20d.csv --summary summary.txt

      - name: 결과 확인
        run: |
          test -s report.html || { echo "report.html 이 비어 있음"; exit 1; }
          test -s summary.txt || { echo "summary.txt 이 비어 있음"; exit 1; }
          echo "생성 크기: $(wc -c < report.html) bytes"
          cat summary.txt

      - name: 페이지용 폴더 구성
        run: |
          mkdir -p public
          cp report.html public/index.html
          cp breakouts_20d.csv public/breakouts.csv
          # 홈 화면 아이콘 — 저장소에 커밋된 것을 그대로 배포한다
          cp apple-touch-icon.png favicon.png icon-512.png public/
          ls -l public/

      - uses: actions/upload-artifact@v4
        with:
          name: screen-output
          path: |
            report.html
            breakouts_20d.csv
            summary.txt
          retention-days: 14

      - name: GitHub Pages 로 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      # 성공이든 실패든 알린다. 조용히 실패하면 오래된 리포트를 최신으로 착각하게 된다.
      - name: 텔레그램 알림
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 시크릿이 없어 알림을 건너뜁니다."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ] && [ -s summary.txt ]; then
            TEXT="$(cat summary.txt)"
          else
            TEXT="[120일선 돌파 스크린] 실행 실패 ($JOB_STATUS)
          리포트가 갱신되지 않았습니다. 이전 결과는 그대로입니다.
          $RUN_URL"
          fi

          # --data-urlencode 로 넘겨 줄바꿈과 특수문자가 깨지지 않게 한다.
          # 토큰은 URL 에만 쓰고 출력하지 않는다.
          code=$(curl -sS -o /tmp/tg.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true")

          if [ "$code" != "200" ]; then
            echo "텔레그램 전송 실패 (HTTP $code)"
            sed -e "s/${TG_TOKEN}/***/g" /tmp/tg.json || true
            exit 1
          fi
          echo "텔레그램 전송 완료"
